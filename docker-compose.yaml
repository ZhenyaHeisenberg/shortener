services:
  postgres:
    container_name: postgres_go
    image: postgres:16.4
    environment: 
      POSTGRES_USER: my_postgres
      POSTGRES_PASSWORD: my_pass
      POSTGRES_DB: my_database
      PGDATA: /data/postgres
    volumes: 
      - ./postgres-data:/data/postgres
    ports: 
    - "5433:5432"